<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Pharma</title>
    
    <!-- Chargement de Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chargement de la police et des icônes --><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- AJOUT: Script officiel des Mini Apps Telegram --><script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Définition des couleurs pour la lueur sombre et l'accentuation */
        :root {
            --bg-dark: #100f1c; /* Fond très sombre (injecté) */
            /* MODIFICATION: Rouge remplacé par Gris */
            --accent-red: #6b7280; /* Gris (était #8b0000) */
            --accent-light: #9ca3af; /* Gris clair (était #ff3333) */
            --card-bg: #1e1d2c;
        }

        /* Styles de base et personnalisés */
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent; /* Conserve la transparence pour le canvas */
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            /* AJOUT ESTHÉTIQUE: Ombre portée sur le texte pour améliorer la lisibilité */
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.6);
        }
        
        /* RETRAIT DES LUEURS CSS AU PROFIT DU CANVAS */
        body::before, body::after {
            content: none !important; 
        }

        /* --- NOUVEAU: Styles pour le Canvas de Vagues (Vaguesblanches.html) --- */
        #wave-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2; /* Positionné en arrière-plan */
            overflow: hidden;
        }
        #waveCanvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
            /* MODIFICATION ESTHÉTIQUE: Le fond du canvas utilise maintenant la variable CSS --bg-dark pour une intégration parfaite */
            background-color: var(--bg-dark); 
        }
        /* ------------------------------------------------------------------- */


        .container-main {
            padding-bottom: 8rem;
            position: relative;
            z-index: 10;
        }
        .nav-bar {
            background-color: rgba(30, 29, 44, 0.85); /* Fond carte sombre transparent */
            backdrop-filter: blur(10px);
            border-radius: 9999px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            padding: 0.5rem 1rem;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 400px;
            z-index: 50;
        }
        .nav-link { 
            color: #d1d5db; 
            transition: color 0.2s, transform 0.1s; 
        }
        /* MODIFICATION: Couleur active passée au gris */
        .nav-link.active { color: var(--accent-light); } /* Gris clair pour l'actif */
        .nav-link:active { transform: scale(0.95); }

        .product-card {
            /* MODIFICATION: Application de l'effet bulle aux cartes produit */
            background: rgba(30,29,44,0.6);
            backdrop-filter: blur(2px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .product-card:hover { box-shadow: 0 0 20px rgba(107, 114, 128, 0.2); } /* MODIFICATION: Ombre grise */
        .product-card:active { transform: scale(0.97); }
        
        .category-pill {
            background-color: rgba(63, 63, 90, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-size: 0.875rem;
        }
        .category-pill:hover,
        .category-pill.active {
            /* MODIFICATION: Passage du rouge au gris */
            background-color: #6b7280; 
            border-color: #9ca3af;
        }
        .category-pill:active { transform: scale(0.95); }

        /* NOUVEAU: Style "bulle" pour la catégorie sur la page produit */
        .category-bubble {
            background-color: rgba(63, 63, 90, 0.5); /* Fond transparent */
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 0.35rem 0.75rem; 
            border-radius: 50px; /* Forme pilule/bulle */
            font-size: 0.875rem; /* Taille de police plus petite */
            font-weight: 600; /* Garder le font-semibold */
            text-align: center;
            
            /* MODIFICATION ESTHÉTIQUE: Légèrement plus large pour mieux respirer */
            max-width: 180px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        /* FIN NOUVEAU */

        /* Styles pour la bannière fixe unique */
        .fixed-banner-container {
            width: 100%;
            padding-top: 100%; /* Permet d'obtenir un ratio 1:1 pour un conteneur */
            position: relative;
            /* MODIFICATION ESTHÉTIQUE: Augmentation de la taille max pour plus d'impact */
            max-width: 300px; 
            margin-left: auto;
            margin-right: auto;
            /* MODIFICATION: Retrait de la bordure/ombre pour laisser place à la bulle de flou */
            /* border: 1px solid rgba(255, 255, 255, 0.1); */
            border-radius: 12px; /* Bords arrondis */
            overflow: hidden;
            /* box-shadow: 0 0 15px rgba(107, 114, 128, 0.2);  */
        }

        .fixed-banner-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 12px; 
        }
        /* Fin des styles de bannière fixe unique */


        /* MODIFICATION DEMANDÉE : Amélioration du visuel de la fiche produit */
        .product-page-image-container { 
            width: 100%;
            aspect-ratio: 4 / 5; 
            max-height: 70vh; 
            overflow: hidden;
            position: relative;
            background-color: #000; 
            margin-left: auto;
            margin-right: auto;
            max-width: 400px;
        }
        
        .carousel-item img, .carousel-item iframe, .carousel-item video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center; 
            border-radius: 12px;
        }
        
        .carousel-slide { display: flex; transition: transform 0.5s ease-in-out; height: 100%; }
        .carousel-item { flex-shrink: 0; width: 100%; height: 100%; }
        
        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            z-index: 20;
            border-radius: 9999px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .carousel-button:hover { opacity: 1; }
        .carousel-button.left { left: 10px; }
        .carousel-button.right { right: 10px; }


        .action-button { 
            transition: transform 0.1s; 
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }
        .action-button:active { transform: scale(0.97); }
        /* MODIFICATION: Passage du rouge au gris */
        .order-button { background-color: #6b7280; color: white; }
        .order-button:hover { background-color: #4b5563; }

        .add-to-cart-button-new {
            background-color: var(--card-bg);
            /* MODIFICATION: Passage du rouge au gris */
            border: 1px solid #6b7280;
            color: #d1d5db;
        }
        .add-to-cart-button-new:hover { background-color: rgba(107, 114, 128, 0.1); }


        .cart-page { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* MODIFICATION: Application de l'effet "modal" flou */
            background-color: rgba(16, 15, 28, 0.8); /* Fond --bg-dark avec 80% opacité */
            backdrop-filter: blur(5px);
            z-index: 50;
            overflow-y: auto;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s 0.3s, opacity 0.3s ease-in-out;
            /* MODIFICATION: Ajustement du padding pour la barre sticky en bas */
            padding-bottom: 5rem; 
        }
        .cart-page.open { 
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        /* NOUVEAU STYLE TOAST (Notification d'ajout au panier) */
        #message-modal {
            position: fixed;
            bottom: 5rem; /* Au-dessus de la barre de navigation */
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-out;
            width: 90%;
            max-width: 300px;
        }
        #message-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(-20px); /* Petit effet de glissement vers le haut */
        }
        .modal-content {
            /* MODIFICATION: Passage du rouge au gris */
            background: #6b7280; 
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px; /* Forme pilule */
            text-align: center;
            /* MODIFICATION: Ombre grise */
            box-shadow: 0 4px 15px rgba(107, 114, 128, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-content button {
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            padding: 0 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        /* FIN NOUVEAU STYLE TOAST */


        .cart-page-header { background-color: var(--bg-dark); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* NOUVEAU STYLE PILULE ET EFFET LUMIÈRE POUR LES BOUTONS DE POIDS */
        .weight-button { 
            background-color: #33334d; 
            border-radius: 9999px; /* Forme pilule */
            padding: 0.5rem 1rem;
            font-weight: 500;
            color: #ffffff;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s; 
            text-align: center;
        }
        .weight-button:active { transform: scale(0.95); }
        .weight-button.active { 
            /* MODIFICATION: Passage du rouge au gris */
            background-color: #6b7280; 
            box-shadow: 0 0 15px rgba(107, 114, 128, 0.6); /* Effet de lueur grise */
            transform: scale(1.05); 
        }

        .separator { width: 50%; height: 1px; background-color: rgba(255, 255, 255, 0.1); margin: 1rem auto; }
        
        .variety-btn { transition: transform 0.1s; border-color: #33334d; }
        .variety-btn.active {
            /* MODIFICATION: Passage du rouge au gris */
            background-color: #6b7280;
            border-color: #9ca3af;
            color: white;
        }
        .variety-btn:active { transform: scale(0.95); }

        /* AMÉLIORATION DE LA LISIBILITÉ SUR MOBILE */
        .product-page-content h2 {
            font-size: 1.75rem; /* Augmenter légèrement la taille du nom du produit */
        }
        
        /* MODIFICATION ESTHÉTIQUE: Retrait de cette règle pour laisser Tailwind (via JS) gérer la taille */
        /* .product-options h3 {
             font-size: 1.2rem; 
        } */

        /* --- SPLASH SCREEN STYLES --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s ease-in-out; 
        }
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            width: 150px;
            height: 150px;
            border-radius: 50%; 
            animation: zoomOutPulse 0.7s forwards; 
        }
        
        @keyframes zoomOutPulse {
            0% { transform: scale(2.0); opacity: 1; } 
            50% { transform: scale(1.0); opacity: 1; } 
            100% { transform: scale(0); opacity: 0; } 
        }
        /* --------------------------- */
    </style>
</head>

        // #############################################################
        // # DÉBUT DES FONCTIONS DU FOND DE VAGUES ANIMÉES (Canvas)

        /**
         * Initialise les paramètres des vagues
         */
        function initWaves() {
            canvas = document.getElementById('waveCanvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            waves = [];

            const minStrokeWidth = 3;
            const maxStrokeWidth = 5;
            
            const startYOffset = -0.05; 
            const spacing = (1 - startYOffset) / numberOfWaves; 
            
            for (let i = 0; i < numberOfWaves; i++) {
                const direction = (Math.random() < 0.5) ? -1 : 1; 

                const randomVariation = (Math.random() * 2 - 1) * speedRange;
                const speed = (baseSpeed + randomVariation) * direction;
                
                const randomStrokeWidth = Math.random() * (maxStrokeWidth - minStrokeWidth) + minStrokeWidth;

                const randomPhase = Math.random() * Math.PI * 2;
                const baseFrequency = 0.006 + (Math.random() * 0.003); 

                waves.push({
                    /* MODIFICATION ESTHÉTIQUE: Couleur de remplissage des vagues (pour correspondre à --card-bg) */
                    color: 'rgba(30, 29, 44, 1)', // Était 'rgba(26, 26, 26, 1)'
                    amplitude: 30, 
                    frequency: baseFrequency, 
                    speed: speed, 
                    yOffset: startYOffset + (i * spacing), 
                    strokeWidth: randomStrokeWidth, 
                    phase: randomPhase,
                    frequencyOffset: Math.random() * Math.PI * 2 
                });
            }
        }

        /**
         * Dessine une ligne de vague avec un décalage vertical.
         */
        const traceWaveLine = (color, width, yDelta, startY, phase, dynamicAmplitude, dynamicFrequency, w) => {
            if (!ctx) return;
            ctx.beginPath();
            
            const startYPosition = startY + Math.sin(0 * dynamicFrequency + phase) * dynamicAmplitude;
            
            ctx.moveTo(0, startYPosition + yDelta);

            for (let x = 0; x < w; x++) {
                const y = startY + Math.sin(x * dynamicFrequency + phase) * dynamicAmplitude;
                ctx.lineTo(x, y + yDelta);
            }

            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineJoin = 'round';
            ctx.stroke();
         };

        /**
         * Dessine une seule vague sinusoïdale avec ses sous-vagues.
         */
        function drawWave(config, index) {
            if (!ctx || !canvas) return;
            const { color, amplitude, frequency, yOffset, strokeWidth } = config;
            const h = canvas.height;
            const w = canvas.width;
            
            const dynamicAmplitude = amplitude + (Math.sin(animationFrame / 150 + index) * 5); 
            const dynamicFrequency = frequency + (Math.sin(animationFrame / 200 + config.frequencyOffset) * 0.0005);
            
            const startY = h * yOffset;
            const phase = config.phase || 0;
            
            // --- 1. Remplissage du corps de la vague ---
            ctx.beginPath();
            
            const startYPosition = startY + Math.sin(0 * dynamicFrequency + phase) * dynamicAmplitude;
            ctx.moveTo(0, startYPosition);
            
            for (let x = 0; x < w; x++) {
                const y = startY + Math.sin(x * dynamicFrequency + phase) * dynamicAmplitude;
                ctx.lineTo(x, y);
            }

            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();

            ctx.fillStyle = color;
            ctx.fill();

            // --- 2. Dessin des 25 sous-vagues (avec fondu d'opacité et d'épaisseur) ---
            for (let i = 0; i < maxSubWaves; i++) {
                const yDelta = i * subWaveSpacing; 
                const opacity = 1.0 - (i / (maxSubWaves - 1) * 0.95); 
                const width = Math.max(0.5, strokeWidth - (i / 10)); 

                /* Utilise subWaveColorBase (maintenant 220) pour des lignes gris clair */
                const lineColor = `rgba(${subWaveColorBase}, ${subWaveColorBase}, ${subWaveColorBase}, ${opacity.toFixed(2)})`;
                
                if (i === 0) {
                    /* MODIFICATION: Lueur grise */
                    ctx.shadowBlur = 8;   
                    ctx.shadowColor = 'rgba(220, 220, 220, 0.8)'; 
                }
                
                traceWaveLine(lineColor, width, yDelta, startY, phase, dynamicAmplitude, dynamicFrequency, w);
                
                if (i === 0) {
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = 'transparent';
                }
            }
        }

        function resizeCanvas() {
            const container = document.getElementById('wave-container');
            if (canvas && container) {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
        }

        function animate() {
            if (!ctx || !canvas || !waves) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            waves.forEach((config, index) => {
                drawWave(config, index); 
                config.phase = (config.phase || 0) + config.speed;
            });

            animationFrame++; 
            requestAnimationFrame(animate);
        }
        
        // #############################################################
        // # FIN DES FONCTIONS DU FOND DE VAGUES ANIMÉES
        // #############################################################

        // --- Initialisation ---
        document.addEventListener('DOMContentLoaded', () => {
             // Initialisation du fond de vagues
             initWaves();
             window.addEventListener('resize', resizeCanvas);
             resizeCanvas();
             animate();

             // Afficher le splash screen au début
             if(splashScreen) splashScreen.style.display = 'flex'; 
             
             // Initialisation de l'API Telegram
             if (window.Telegram && window.Telegram.WebApp) {
                 window.Telegram.WebApp.ready();
             }

             // Initialisation de la boutique après 0.7 seconde
             setTimeout(() => {
                 if(splashScreen) splashScreen.classList.add('hidden');
                 if(mainApp) mainApp.style.visibility = 'visible';
                 
                 initProductGrid();
                 updateCartCounter();
                 
                 // Définir l'onglet actif au démarrage
                 const homeLink = document.querySelector('a[onclick="window.showHome()"]');
                 setActiveNav(homeLink);

             }, 700); // Durée ajustée à 0.7 seconde
         });

         window.showProduct = showProduct; window.hideProduct = hideProduct; window.openCartPage = openCartPage; window.closeCartPage = closeCartPage; window.closeModal = closeModal; window.selectWeight = selectWeight;
    </script>
</body>
</html>
